<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>Vista Orizon | Luxury Architectural Designs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
}

/* Premium Background with Gradient Overlay */
.hero-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    filter: brightness(0.7);
}

.gradient-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.75) 100%);
    z-index: -1;
}

/* Elegant Floating Logo */
.logo-container {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 100;
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.08);
    padding: 8px 18px;
    border-radius: 60px;
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s ease;
}

.logo-container img {
    height: 42px;
    width: auto;
    display: block;
}

/* Modern Menu Button - Glass Morphism */
.menu-toggle {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    z-index: 100;
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.menu-toggle:hover {
    background: rgba(194, 178, 62, 0.2);
    border-color: rgba(194, 178, 62, 0.5);
}

.menu-toggle span {
    width: 24px;
    height: 2px;
    background: white;
    border-radius: 2px;
    transition: all 0.3s ease;
}

.menu-toggle.active span:nth-child(1) {
    transform: rotate(45deg) translate(6px, 6px);
    background: #c2b23e;
}

.menu-toggle.active span:nth-child(2) {
    opacity: 0;
    transform: scaleX(0.8);
}

.menu-toggle.active span:nth-child(3) {
    transform: rotate(-45deg) translate(6px, -6px);
    background: #c2b23e;
}

/* Sleek Side Navigation - Updated Menu Items */
.side-nav-premium {
    position: fixed;
    top: 0;
    right: -100%;
    width: 85%;
    max-width: 380px;
    height: 100vh;
    background: rgba(10, 10, 10, 0.98);
    backdrop-filter: blur(20px);
    z-index: 99;
    padding: 100px 40px 40px;
    transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    border-left: 1px solid rgba(194, 178, 62, 0.3);
    box-shadow: -10px 0 40px rgba(0,0,0,0.5);
}

.side-nav-premium.active {
    right: 0;
}

.side-nav-premium ul {
    list-style: none;
}

.side-nav-premium ul li {
    margin: 32px 0;
    opacity: 0;
    transform: translateX(30px);
    transition: all 0.4s ease;
    transition-delay: calc(0.05s * var(--i, 0));
}

.side-nav-premium.active ul li {
    opacity: 1;
    transform: translateX(0);
}

.side-nav-premium ul li:nth-child(1) { --i: 1; }
.side-nav-premium ul li:nth-child(2) { --i: 2; }
.side-nav-premium ul li:nth-child(3) { --i: 3; }

.side-nav-premium ul li a {
    color: #fff;
    text-decoration: none;
    font-size: 1.6rem;
    font-weight: 500;
    font-family: 'Playfair Display', serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    display: inline-block;
    position: relative;
}

.side-nav-premium ul li a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: #c2b23e;
    transition: width 0.3s ease;
}

.side-nav-premium ul li a:hover {
    color: #c2b23e;
    transform: translateX(8px);
}

.side-nav-premium ul li a:hover::after {
    width: 100%;
}

/* Main Content - Centered with Elegant Spacing */
.main-content {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 24px 100px;
}

.content-wrapper {
    max-width: 1200px;
    width: 100%;
    text-align: center;
}

/* Hero Section */
.hero-section {
    margin-bottom: 50px;
}

.hero-section h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 8vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 0%, #c2b23e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

.subtitle {
    font-size: clamp(0.85rem, 4vw, 1.1rem);
    font-weight: 400;
    opacity: 0.85;
    letter-spacing: 3px;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
}

.subtitle::before,
.subtitle::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 30px;
    height: 1px;
    background: rgba(194, 178, 62, 0.5);
}

.subtitle::before {
    left: -40px;
}

.subtitle::after {
    right: -40px;
}

/* UNIFORM ICON GRID - All cards now have consistent dimensions */
.icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 160px));
    gap: 28px 20px;
    justify-content: center;
    align-items: center;
    margin-top: 30px;
}

/* FIXED SIZE CARD - All cards identical dimensions */
.icon-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(4px);
    padding: 18px 12px 14px;
    border-radius: 24px;
    transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    min-width: 0; /* Prevents overflow */
    width: 100%;
    height: auto;
    box-sizing: border-box;
}

/* UNIFORM ICON SIZE - All images forced to same dimensions */
.icon-card img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    transition: transform 0.3s ease;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    display: block;
    margin: 0 auto;
}

.icon-card:hover img {
    transform: scale(1.05);
}

/* UNIFORM LABEL STYLE - Consistent text block */
.icon-label {
    margin-top: 14px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #fff;
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 40px;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
    width: fit-content;
    max-width: 100%;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
}

/* For smaller screens, allow label to wrap if needed */
@media (max-width: 550px) {
    .icon-label {
        white-space: normal;
        font-size: 0.7rem;
        padding: 4px 10px;
    }
}

.icon-card:hover .icon-label {
    background: #c2b23e;
    color: #0a0a0a;
    transform: scale(1.02);
}

/* PREMIUM SOCIAL BAR - NO DARK BACKGROUND, fully transparent/glass effect */
.social-links {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 35px;
    padding: 18px 20px;
    background: transparent;
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    z-index: 90;
    transition: all 0.3s ease;
}

.social-icon {
    color: #fff;
    font-size: 1.3rem;
    transition: all 0.3s ease;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
}

.social-icon:hover {
    color: #c2b23e;
    transform: translateY(-5px);
    background: rgba(194, 178, 62, 0.25);
}

/* ========== RESPONSIVE DESIGN - PHONE EXCELLENCE ========== */
@media (max-width: 640px) {
    .logo-container {
        top: 16px;
        left: 16px;
        padding: 6px 14px;
    }
    
    .logo-container img {
        height: 32px;
    }
    
    .menu-toggle {
        top: 16px;
        right: 16px;
        width: 44px;
        height: 44px;
    }
    
    .main-content {
        padding: 90px 16px 80px;
    }
    
    .hero-section {
        margin-bottom: 35px;
    }
    
    /* Phone optimized grid: 2 columns with uniform card sizing */
    .icon-grid {
        grid-template-columns: repeat(2, minmax(130px, 150px));
        gap: 18px;
        margin-left: auto;
        margin-right: auto;
        justify-content: center;
    }
    
    .icon-card {
        padding: 16px 10px 12px;
        min-height: auto;
    }
    
    /* Uniform icon size on mobile */
    .icon-card img {
        width: 65px;
        height: 65px;
    }
    
    .icon-label {
        font-size: 0.68rem;
        padding: 5px 10px;
        margin-top: 10px;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }
    
    /* For very small screens allow text wrap */
    @media (max-width: 420px) {
        .icon-label {
            white-space: normal;
            font-size: 0.62rem;
            padding: 4px 8px;
        }
        .icon-card img {
            width: 58px;
            height: 58px;
        }
        .icon-grid {
            gap: 14px;
            grid-template-columns: repeat(2, minmax(110px, 1fr));
        }
    }
    
    .social-links {
        gap: 25px;
        padding: 12px 20px;
        background: transparent;
        backdrop-filter: blur(10px);
    }
    
    .social-icon {
        font-size: 1.1rem;
        width: 36px;
        height: 36px;
    }
    
    .subtitle::before,
    .subtitle::after {
        width: 20px;
    }
    
    .subtitle::before {
        left: -28px;
    }
    
    .subtitle::after {
        right: -28px;
    }
}

/* Small phones (below 400px) */
@media (max-width: 480px) {
    .icon-card img {
        width: 58px;
        height: 58px;
    }
    
    .icon-label {
        font-size: 0.6rem;
        padding: 4px 8px;
        margin-top: 8px;
        white-space: normal;
        line-height: 1.3;
    }
    
    .hero-section h1 {
        font-size: 1.9rem;
    }
    
    .side-nav-premium {
        padding: 90px 30px 30px;
    }
    
    .side-nav-premium ul li a {
        font-size: 1.3rem;
    }
    
    .icon-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    
    .icon-card {
        padding: 12px 8px 10px;
    }
}

/* Tablets and medium screens - 3 columns with uniform size */
@media (min-width: 641px) and (max-width: 1024px) {
    .icon-grid {
        grid-template-columns: repeat(3, minmax(130px, 150px));
        gap: 25px;
    }
    
    .icon-card img {
        width: 75px;
        height: 75px;
    }
    
    .icon-label {
        font-size: 0.72rem;
        padding: 6px 12px;
    }
}

/* Laptop and Desktop - Elegant 3 column layout uniform */
@media (min-width: 1025px) {
    .icon-grid {
        grid-template-columns: repeat(3, minmax(150px, 170px));
        gap: 40px;
    }
    
    .icon-card {
        padding: 24px 16px 18px;
    }
    
    .icon-card img {
        width: 85px;
        height: 85px;
    }
    
    .icon-label {
        font-size: 0.8rem;
        padding: 7px 16px;
        margin-top: 16px;
    }
    
    .social-icon {
        font-size: 1.4rem;
        width: 45px;
        height: 45px;
    }
    
    .logo-container img {
        height: 48px;
    }
    
    .social-links {
        background: transparent;
        backdrop-filter: blur(12px);
    }
}

/* Landscape orientation for phones - maintain uniform sizing */
@media (max-width: 850px) and (orientation: landscape) {
    .main-content {
        padding: 70px 20px 70px;
    }
    
    .icon-grid {
        grid-template-columns: repeat(3, minmax(110px, 130px));
        gap: 15px;
    }
    
    .icon-card img {
        width: 55px;
        height: 55px;
    }
    
    .icon-label {
        font-size: 0.6rem;
        padding: 3px 8px;
        margin-top: 6px;
        white-space: nowrap;
    }
    
    .hero-section {
        margin-bottom: 20px;
    }
    
    .hero-section h1 {
        font-size: 1.6rem;
    }
}

/* Touch-friendly improvements */
@media (hover: none) and (pointer: coarse) {
    .icon-card:active {
        transform: scale(0.97);
        background: rgba(194, 178, 62, 0.2);
    }
    
    .icon-card:active .icon-label {
        background: #c2b23e;
        color: #0a0a0a;
    }
}

/* Smooth scrolling and accessibility */
html {
    scroll-behavior: smooth;
}

::selection {
    background: #c2b23e;
    color: #0a0a0a;
}

/* Additional fix for image consistency - ensures no distorted aspect ratio */
.icon-card img[src*="balustrade"], 
.icon-card img[src*="shower"],
.icon-card img[src*="gazebo"],
.icon-card img[src*="carport"],
.icon-card img[src*="curtain"],
.icon-card img[src*="Modern"] {
    object-fit: contain;
    width: 100%;
    height: auto;
    max-width: 75px;
    max-height: 75px;
}

@media (max-width: 640px) {
    .icon-card img {
        max-width: 65px;
        max-height: 65px;
    }
}

@media (max-width: 480px) {
    .icon-card img {
        max-width: 58px;
        max-height: 58px;
    }
}
</style>
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop playsinline class="hero-bg">
    <source src="YTDown.com_YouTube_Inside-The-World-s-Most-Secret-House-Bui_Media_OMUfmlPs_w4_001_1080p (1).mp4" type="video/mp4">
</video>
<div class="gradient-overlay"></div>

<!-- Logo with Glass Effect -->
<div class="logo-container">
    <img src="553106437_17845870137574455_8823922694648873162_n-removebg-preview.png" alt="Vista Orizon">
</div>

<!-- Modern Menu Button -->
<div class="menu-toggle" id="menuToggle" onclick="togglePremiumMenu()">
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- Premium Side Navigation - Updated: Contact only, removed Portfolio/Studio/Home -->
<div class="side-nav-premium" id="premiumSideNav">
    <ul>
        <li><a href="#contact">Contact</a></li>
    </ul>
</div>

<!-- Main Content Area -->
<main class="main-content">
    <div class="content-wrapper">
        <!-- Hero Section -->
        <div class="hero-section">
            <h1>Vista Orizon</h1>
            <div class="subtitle">BY BRHILL ELITE</div>
        </div>
        
        <!-- Elegant Icon Grid with Uniform Sizing - All icons now same dimensions -->
        <div class="icon-grid">
            <a href="gazebo.html" class="icon-card">
                <img src="gazebo.png" alt="Gazebo" style="width:75px; height:75px; object-fit:contain;">
                <span class="icon-label">GAZEBO</span>
            </a>
            <a href="carports.html" class="icon-card">
                <img src="carport.png" alt="Carports" style="width:75px; height:75px; object-fit:contain;">
                <span class="icon-label">CARPORTS</span>
            </a>
            <a href="balustrades.html" class="icon-card">
                <img src="balustrade.png" alt="Balustrades" style="width:75px; height:75px; object-fit:contain;">
                <span class="icon-label">BALUSTRADES</span>
            </a>
            <a href="shower cubicles.html" class="icon-card">
                <img src="shower cubicle.png" alt="Shower Cubicles" style="width:75px; height:75px; object-fit:contain;">
                <span class="icon-label">SHOWER</span>
            </a>
            <a href="curtain wall.html" class="icon-card">

                <span class="icon-label">CURTAIN WALL</span>
            </a>
            <a href="glass facades.html" class="icon-card">
                <img src="Screenshot_2026-02-25_12.55.54_PM-removebg-preview.png" alt="Modern Elite" style="width:75px; height:75px; object-fit:contain;">
                <span class="icon-label">GLASS FACADES </span>
            </a>
        </div>
    </div>
</main>

<!-- Social Bar - NO DARK BACKGROUND (transparent glass effect) -->
<div class="social-links">
    <a href="https://www.instagram.com/vista_orizon/" target="_blank" class="social-icon" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.tiktok.com/@vistaorizon" target="_blank" class="social-icon" aria-label="TikTok">
        <i class="fab fa-tiktok"></i>
    </a>
    <a href="https://wa.me/+254116589060" target="_blank" class="social-icon" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>
</div>

<script>
// Premium Menu Toggle Function
function togglePremiumMenu() {
    const menuBtn = document.getElementById('menuToggle');
    const sideNav = document.getElementById('premiumSideNav');
    
    menuBtn.classList.toggle('active');
    sideNav.classList.toggle('active');
    
    // Prevent body scroll when menu is open (better mobile UX)
    if (sideNav.classList.contains('active')) {
        document.body.style.overflow = 'hidden';
    } else {
        document.body.style.overflow = '';
    }
}

// Close menu when clicking on navigation link (Contact)
document.querySelectorAll('.side-nav-premium ul li a').forEach(link => {
    link.addEventListener('click', (e) => {
        const menuBtn = document.getElementById('menuToggle');
        const sideNav = document.getElementById('premiumSideNav');
        
        if (sideNav.classList.contains('active')) {
            menuBtn.classList.remove('active');
            sideNav.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // For contact link, handle smooth scroll if needed or allow navigation
        const href = link.getAttribute('href');
        if (href && href === '#contact') {
            e.preventDefault();
            // Optional: Scroll to contact section or show contact info
            // For now we can show an alert or scroll to top
            alert('📞 Contact Vista Orizon: +254 116 589060 | hello@vistaorizon.com');
        } else if (href && href !== '#') {
            // Allow normal navigation for other pages
            return;
        } else {
            e.preventDefault();
        }
    });
});

// Close menu when clicking outside (desktop & mobile enhancement)
document.addEventListener('click', (e) => {
    const menuBtn = document.getElementById('menuToggle');
    const sideNav = document.getElementById('premiumSideNav');
    if (!sideNav || !menuBtn) return;
    const isClickInsideNav = sideNav.contains(e.target);
    const isClickOnMenuBtn = menuBtn.contains(e.target);
    
    if (sideNav.classList.contains('active') && !isClickInsideNav && !isClickOnMenuBtn) {
        menuBtn.classList.remove('active');
        sideNav.classList.remove('active');
        document.body.style.overflow = '';
    }
});

// Handle window resize - reset body overflow if menu is open on resize
window.addEventListener('resize', () => {
    const sideNav = document.getElementById('premiumSideNav');
    if (sideNav && window.innerWidth > 768 && sideNav.classList.contains('active')) {
        const menuBtn = document.getElementById('menuToggle');
        menuBtn.classList.remove('active');
        sideNav.classList.remove('active');
        document.body.style.overflow = '';
    }
});

// Add subtle animation on load with uniform card appearance
window.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.icon-card');
    cards.forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        setTimeout(() => {
            card.style.transition = 'all 0.5s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, 100 + (index * 50));
    });
    
    // Additional fix to ensure all images are forced to uniform container size
    const allImages = document.querySelectorAll('.icon-card img');
    allImages.forEach(img => {
        // Guarantee each image has consistent dimensions set by CSS and inline fallback
        if (!img.style.width) {
            img.style.width = '75px';
            img.style.height = '75px';
        }
        img.style.objectFit = 'contain';
    });
});

// Prevent zoom on double-tap for better mobile experience (optional)
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
        e.preventDefault();
    }
    lastTouchEnd = now;
}, false);

// Ensure social bar background stays transparent even after any dynamic changes
const socialBar = document.querySelector('.social-links');
if (socialBar) {
    socialBar.style.background = 'transparent';
}
</script>
</body>
