<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Orizon | Transition to Home</title>
  <style>
    /* ========================================
       ROOT VARIABLES & RESET
       ======================================== */
    :root {
      --bg-deep: #0c0c0f;
      --bg-surface: rgba(255, 255, 255, 0.03);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-primary: #f5f0e8;
      --text-secondary: rgba(245, 240, 232, 0.55);
      --accent: #c9a96e;
      --accent-soft: rgba(201, 169, 110, 0.15);
      --shadow-glow: rgba(201, 169, 110, 0.2);
      --glass-blur: 24px;
      --serif: Georgia, 'Times New Roman', Times, serif;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--sans);
      overflow-x: hidden;
      position: relative;
    }

    /* ========================================
       BACKGROUND LAYERS — Vintage + Contemporary
       ======================================== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Animated gradient orbs for depth */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: orbFloat 20s ease-in-out infinite;
    }

    .bg-orb:nth-child(1) {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201,169,110,0.18), transparent 70%);
      top: -10%;
      left: -10%;
      animation-delay: 0s;
    }

    .bg-orb:nth-child(2) {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(140,120,180,0.12), transparent 70%);
      bottom: -15%;
      right: -10%;
      animation-delay: -7s;
      animation-duration: 25s;
    }

    .bg-orb:nth-child(3) {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(100,140,160,0.10), transparent 70%);
      top: 40%;
      left: 60%;
      animation-delay: -14s;
      animation-duration: 22s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.08); }
      66% { transform: translate(-30px, 20px) scale(0.95); }
    }

    /* Subtle geometric pattern overlay */
    .bg-pattern {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(255,255,255,0.15) 1px, transparent 1px),
        radial-gradient(circle at 75% 75%, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 60px 60px, 40px 40px;
      animation: patternShift 30s linear infinite;
    }

    @keyframes patternShift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 60px 60px, -40px -40px; }
    }

    /* Noise texture for vintage paper feel */
    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    /* Vignette for depth */
    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
    }

    /* ========================================
       LOADER STAGE
       ======================================== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s;
    }

    #loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: 100%;
      max-width: 520px;
      background: var(--bg-surface);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border-subtle);
      border-radius: 2rem;
      padding: clamp(2.5rem, 6vw, 4rem) clamp(2rem, 5vw, 3.5rem);
      box-shadow:
        0 32px 64px -16px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 0 80px -20px var(--shadow-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Shimmer edge on loader card */
    .loader-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(135deg, rgba(201,169,110,0.3), transparent 40%, transparent 60%, rgba(201,169,110,0.15));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Monogram */
    .monogram-wrap {
      margin-bottom: 2.5rem;
      position: relative;
    }

    .monogram-ring {
      width: 110px;
      height: 110px;
      position: relative;
    }

    .monogram-ring svg.ring-spinner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .monogram-ring svg.ring-spinner circle.track {
      fill: none;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 2.5;
    }

    .monogram-ring svg.ring-spinner circle.fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0 0 6px var(--shadow-glow));
    }

    .monogram-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--text-primary);
      animation: monogramReveal 0.8s ease-out 0.3s both;
    }

    @keyframes monogramReveal {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Brand name */
    .brand-name {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: 0.6rem;
      line-height: 1.2;
    }

    .brand-tagline {
      font-family: var(--sans);
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(201,169,110,0.6), var(--accent), rgba(201,169,110,0.8));
      border-radius: 3px;
      transition: width 0.15s linear;
      box-shadow: 0 0 12px var(--shadow-glow);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent), 0 0 24px var(--shadow-glow);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 0.75rem;
      padding: 0 0.1rem;
    }

    .progress-percent {
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      min-width: 2.5rem;
      text-align: left;
    }

    .progress-status {
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-align: right;
      flex: 1;
      margin-left: 1rem;
    }

    /* Loader footer */
    .loader-footer {
      margin-top: 2rem;
      font-size: 0.65rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(245, 240, 232, 0.2);
      position: relative;
    }

    .loader-footer::before {
      content: '';
      position: absolute;
      top: -1rem;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,0.3), transparent);
    }

    /* Pulse animation on loading */
    @keyframes softPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ========================================
       HERO STAGE (Initially hidden)
       ======================================== */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1) 0.15s, visibility 1s 0.15s;
    }

    #hero.revealed {
      opacity: 1;
      visibility: visible;
    }

    .hero-inner {
      text-align: center;
      max-width: 640px;
      transform: translateY(20px) scale(0.98);
      filter: blur(6px);
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.25s, filter 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.25s;
    }

    #hero.revealed .hero-inner {
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .hero-greeting {
      font-family: var(--sans);
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease 0.6s, transform 0.8s ease 0.6s;
    }

    #hero.revealed .hero-greeting {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.9s ease 0.75s, transform 0.9s ease 0.75s;
    }

    #hero.revealed .hero-title {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-title em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 1.5rem;
      opacity: 0;
      transform: scaleX(0);
      transition: opacity 0.6s ease 0.9s, transform 0.6s ease 0.9s;
    }

    #hero.revealed .hero-divider {
      opacity: 1;
      transform: scaleX(1);
    }

    .hero-subtitle {
      font-family: var(--sans);
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      font-weight: 400;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease 1s, transform 0.8s ease 1s;
    }

    #hero.revealed .hero-subtitle {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.5rem;
      background: transparent;
      border: 1px solid rgba(201, 169, 110, 0.4);
      border-radius: 60px;
      color: var(--accent);
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(10px);
      /* combine both transitions carefully: we need two separate groups? 
         We'll merge via transition for all properties but to keep specific delays we use separate */
      transition-property: opacity, transform, border-color, box-shadow, letter-spacing;
      transition-duration: 0.8s, 0.8s, 0.3s, 0.3s, 0.3s;
      transition-delay: 1.1s, 1.1s, 0s, 0s, 0s;
      transition-timing-function: ease, ease, cubic-bezier(0.4, 0, 0.2, 1), cubic-bezier(0.4, 0, 0.2, 1), cubic-bezier(0.4, 0, 0.2, 1);
    }

    #hero.revealed .hero-cta {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .hero-cta:hover {
      border-color: var(--accent);
      box-shadow: 0 0 30px -5px var(--shadow-glow), 0 0 0 1px rgba(201,169,110,0.2) inset;
      letter-spacing: 3.5px;
      transform: translateY(-2px);
    }

    .hero-cta:hover::before {
      opacity: 1;
    }

    .hero-cta span,
    .hero-cta svg {
      position: relative;
      z-index: 1;
    }

    .hero-cta svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      transition: transform 0.3s ease;
    }

    .hero-cta:hover svg {
      transform: translateX(4px);
    }

    /* Decorative corner flourishes */
    .flourish {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0;
      transition: opacity 1s ease 1.3s;
    }

    #hero.revealed .flourish {
      opacity: 0.15;
    }

    .flourish svg {
      width: 100%;
      height: 100%;
      stroke: var(--accent);
      stroke-width: 1;
      fill: none;
    }

    .flourish-tl { top: 2.5rem; left: 2.5rem; }
    .flourish-tr { top: 2.5rem; right: 2.5rem; transform: scaleX(-1); }
    .flourish-bl { bottom: 2.5rem; left: 2.5rem; transform: scaleY(-1); }
    .flourish-br { bottom: 2.5rem; right: 2.5rem; transform: scale(-1); }

    /* ========================================
       RESPONSIVE
       ======================================== */
    @media (max-width: 480px) {
      .loader-card {
        border-radius: 1.5rem;
        padding: 2rem 1.5rem;
      }

      .monogram-ring {
        width: 90px;
        height: 90px;
      }

      .monogram-content {
        font-size: 1.6rem;
      }

      .hero-title {
        font-size: clamp(2.2rem, 10vw, 3rem);
      }

      .flourish {
        display: none;
      }
    }

    @media (min-width: 1400px) {
      .loader-card {
        max-width: 560px;
      }
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* additional fade class for page link transition (optional but smooth) */
    .page-transition-out {
      animation: fadeOutPage 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeOutPage {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>

  <!-- ========== BACKGROUND ========== -->
  <div class="bg-layer">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
  </div>
  <div class="bg-pattern"></div>
  <div class="bg-noise"></div>
  <div class="bg-vignette"></div>

  <!-- ========== LOADER STAGE ========== -->
  <div id="loader">
    <div class="loader-card">

      <!-- Monogram with circular progress -->
      <div class="monogram-wrap">
        <div class="monogram-ring">
          <svg class="ring-spinner" viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="45"/>
            <circle class="fill" id="ringFill" cx="50" cy="50" r="45"/>
          </svg>
          <div class="monogram-content">VO</div>
        </div>
      </div>

      <!-- Brand -->
      <h1 class="brand-name">Vista Orizon</h1>
      <p class="brand-tagline">Estates &amp; Collection</p>

      <!-- Linear progress + status -->
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="progress-meta">
          <span class="progress-percent" id="percentText">0%</span>
          <span class="progress-status" id="statusText">Initializing</span>
        </div>
      </div>

      <!-- Footer -->
      <div class="loader-footer">Please wait</div>

    </div>
  </div>

  <!-- ========== HERO STAGE ========== -->
  <div id="hero">

    <!-- Corner flourishes -->
    <div class="flourish flourish-tl">
      <svg viewBox="0 0 40 40"><path d="M0 40 L0 10 Q0 0 10 0 L40 0"/></svg>
    </div>
    <div class="flourish flourish-tr">
      <svg viewBox="0 0 40 40"><path d="M0 40 L0 10 Q0 0 10 0 L40 0"/></svg>
    </div>
    <div class="flourish flourish-bl">
      <svg viewBox="0 0 40 40"><path d="M0 40 L0 10 Q0 0 10 0 L40 0"/></svg>
    </div>
    <div class="flourish flourish-br">
      <svg viewBox="0 0 40 40"><path d="M0 40 L0 10 Q0 0 10 0 L40 0"/></svg>
    </div>

    <div class="hero-inner">
      <p class="hero-greeting">Welcome to</p>
      <h2 class="hero-title">Vista<br><em>Orizon</em></h2>
      <div class="hero-divider"></div>
      <p class="hero-subtitle">
        Where Timeless elegance meets modern living.<br>
         Discover our curated collection of gazebos, carports, balustrades,<br>
         shower cubicles, glass facades, curtain walls, and other extraordinary experiences. <br>
      
  
      </p>
      <!-- CONNECTION TO HOMEPAGE.HTML: Now the button navigates to homepage.html with a smooth transition effect -->
      <a href="homepage.html" class="hero-cta" id="enterButton">
        <span>Enter</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>

  <script>
    (function() {
      /* ================================
         REALISTIC LOADING SIMULATION
         ================================ */
      const ringFill = document.getElementById('ringFill');
      const progressBar = document.getElementById('progressBar');
      const percentText = document.getElementById('percentText');
      const statusText = document.getElementById('statusText');
      const loader = document.getElementById('loader');
      const hero = document.getElementById('hero');

      const RING_CIRCUMFERENCE = 2 * Math.PI * 45; // ~283

      const statusMessages = [
        { threshold: 0,  text: 'Initializing' },
        { threshold: 12, text: 'Loading assets' },
        { threshold: 28, text: 'Resolving content' },
        { threshold: 45, text: 'Optimizing layout' },
        { threshold: 62, text: 'Fetching imagery' },
        { threshold: 78, text: 'Finalizing styles' },
        { threshold: 92, text: 'Preparing view' },
        { threshold: 100, text: 'Ready' }
      ];

      let progress = 0;
      let lastTimestamp = 0;
      let elapsed = 0;
      const TARGET_DURATION = 3200; // ~3.2 seconds total

      // Variable speed curve: fast at start, slow in middle, fast at end
      function speedCurve(t) {
        if (t < 0.2) return 2.0;
        if (t < 0.5) return 0.6;
        if (t < 0.75) return 0.9;
        return 1.6;
      }

      function updateUI(pct) {
        // Ring
        const offset = RING_CIRCUMFERENCE - (pct / 100) * RING_CIRCUMFERENCE;
        ringFill.style.strokeDashoffset = Math.max(0, offset);

        // Bar
        progressBar.style.width = pct + '%';

        // Percent text
        percentText.textContent = Math.floor(pct) + '%';

        // Status text
        for (let i = statusMessages.length - 1; i >= 0; i--) {
          if (pct >= statusMessages[i].threshold) {
            if (statusText.textContent !== statusMessages[i].text) {
              statusText.style.opacity = '0.6';
              setTimeout(() => {
                statusText.textContent = statusMessages[i].text;
                statusText.style.opacity = '1';
              }, 80);
            }
            break;
          }
        }
      }

      function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = timestamp - lastTimestamp;
        lastTimestamp = timestamp;
        elapsed += delta;

        const t = Math.min(elapsed / TARGET_DURATION, 1);
        const speed = speedCurve(t);
        const increment = (delta / TARGET_DURATION) * 100 * speed;

        progress = Math.min(progress + increment, 100);
        updateUI(progress);

        if (progress < 100) {
          requestAnimationFrame(animate);
        } else {
          setTimeout(transitionToHero, 350);
        }
      }

      function transitionToHero() {
        loader.classList.add('done');
        hero.classList.add('revealed');
        setTimeout(() => {
          loader.style.display = 'none';
          document.body.style.overflow = 'auto';
        }, 1000);
      }

      requestAnimationFrame(animate);

      /* ================================
         HOME.HTML CONNECTION - Enhanced navigation with optional smooth fade
         ================================ */
      const enterBtn = document.getElementById('enterButton');
      if (enterBtn) {
        enterBtn.addEventListener('click', function(e) {
          // If the user clicks, we can optionally add an elegant fade-out effect before leaving.
          // But standard navigation works fine. However, we want to ensure that if home.html exists 
          // it navigates directly without breaking any user experience.
          // Since we want a seamless connection, we add a subtle page transition.
          e.preventDefault();
          const targetUrl = enterBtn.getAttribute('href'); // "home.html"
          
          // Add graceful fade-out to body before leaving
          document.body.style.pointerEvents = 'none';
          document.body.classList.add('page-transition-out');
          
          // Small delay to let fade-out complete, then navigate
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 400);
        });
      }

      // Also optional: For better UX, ensure that after loading the button is fully interactive.
      // No other conflicts.
      document.addEventListener('DOMContentLoaded', () => {
        document.body.style.opacity = '1';
      });
    })();
  </script>
</body>
